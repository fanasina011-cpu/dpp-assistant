# ============================================================================
# DPP Assistant — Orchestration Docker
# ============================================================================
#
# Usage :
#     docker compose up --build        # Premier lancement
#     docker compose up -d             # Démarrage en arrière-plan
#     docker compose down              # Arrêt
#     docker compose logs -f backend   # Voir les logs du backend
#
# Accès :
#     Frontend : http://localhost:5173
#     Backend  : http://localhost:8000
#     MySQL    : localhost:3308
#
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Redis — broker pour Celery
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dpp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dpp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  # --------------------------------------------------------------------------
  # MySQL 8.0
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: dpp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: DppRoot2026!
      MYSQL_DATABASE: dpp_assistant
      MYSQL_USER: dpp_user
      MYSQL_PASSWORD: dpp_password_dev
    ports:
      - "3308:3306"
    volumes:
      - dpp_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pDppRoot2026!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s


  # --------------------------------------------------------------------------
  # Backend Django
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dpp_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: docker_dev_secret_key_change_in_prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

      DB_NAME: dpp_assistant
      DB_USER: dpp_user
      DB_PASSWORD: dpp_password_dev
      DB_HOST: mysql
      DB_PORT: "3306"

      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - dpp_media:/app/media

  # --------------------------------------------------------------------------
  # Celery Worker — exécute les jobs en arrière-plan
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dpp_celery_worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: docker_dev_secret_key_change_in_prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

      DB_NAME: dpp_assistant
      DB_USER: dpp_user
      DB_PASSWORD: dpp_password_dev
      DB_HOST: mysql
      DB_PORT: "3306"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    entrypoint: []
    command: celery -A core worker -l info
    volumes:
      - dpp_media:/app/media

  # --------------------------------------------------------------------------
  # Celery Beat — planificateur (lance les jobs selon un planning)
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dpp_celery_beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: docker_dev_secret_key_change_in_prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

      DB_NAME: dpp_assistant
      DB_USER: dpp_user
      DB_PASSWORD: dpp_password_dev
      DB_HOST: mysql
      DB_PORT: "3306"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    entrypoint: []
    command: celery -A core beat -l info
    volumes:
      - dpp_media:/app/media

  # --------------------------------------------------------------------------
  # Frontend React + Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dpp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dpp_mysql_data:
    name: dpp_mysql_data
  dpp_media:
    name: dpp_media
  dpp_redis_data:
    name: dpp_redis_data