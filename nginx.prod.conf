server {
    listen 80;
    server_name _;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Frontend React (servi par le conteneur frontend)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Interface admin Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Fichiers statiques Django (collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers media (pièces jointes)
    location /media/ {
        alias /app/media/;
    }

    # =====================================================================
    # Options TLS (ne pas activer ici si SSL est géré en amont)
    # =====================================================================
    #
    # Option A — Nginx hôte + Let's Encrypt (recommandé) :
    #   Laisser ce bloc sur le port 80, Certbot s'occupe du 443 sur l'hôte.
    #
    # Option B — Cloudflare / reverse proxy cloud :
    #   SSL terminé en amont, ce conteneur reste en HTTP.
    #
    # Si vous activez HTTPS directement dans ce conteneur, décommenter :
    #
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/dpp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dpp.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    #
    # Redirection HTTP → HTTPS :
    #
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
}
